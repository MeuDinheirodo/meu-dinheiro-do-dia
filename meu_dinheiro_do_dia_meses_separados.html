<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fa">
<title>Meu Dinheiro do Dia</title>
<style>
:root{--bg:#fff8fb;--panel:#fff0f5;--card:#ffe4ee;--lime:#d94f87;--pink:#c83f72;--text:#4b2637;--muted:#916b7b;--line:#f0c8d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}
input[type="date"]{color-scheme:light}
input[type="date"]::-webkit-calendar-picker-indicator{filter:none;opacity:1;cursor:pointer}
input[type="date"]::-webkit-datetime-edit{color:var(--text)}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}.hero{background:var(--panel);padding:24px 18px 20px;border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;background:var(--lime);color:#ffffff;border-radius:15px;display:grid;place-items:center;font-size:26px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.08em;margin:22px 0 4px}.big{font-size:32px;font-weight:750;letter-spacing:-.04em}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.metric{background:var(--card);border-radius:17px;padding:14px;min-width:0}.metric span{font-size:13px;color:#7c5264}.metric strong{display:block;font-size:20px;margin-top:5px;overflow-wrap:anywhere}.green{color:var(--lime)}.red{color:var(--pink)}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:12px 10px;position:sticky;top:0;background:var(--bg);z-index:2}.tab{background:transparent;color:#704b5c;border-radius:13px;padding:11px 3px;font-size:12px}.tab.active{background:#f8d6e4;color:#a82f62}.tab b{display:block;font-size:20px;margin-bottom:2px}.content{padding:12px 16px}.section-title{font-size:22px;margin:8px 0 16px}.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#ffffff}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;background:#fffafd;border:1px solid #e4b9cb;border-radius:13px;padding:13px;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--lime)}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button,.secondary{border:1px solid #e4b9cb;background:#fff4f8;color:#704b5c;padding:10px 13px;border-radius:12px}.choice button.selected{background:#f8d6e4;border-color:var(--lime);color:#a82f62}.primary{width:100%;background:var(--lime);color:#ffffff;font-weight:750;padding:14px;border-radius:14px;margin-top:6px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.list-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f2d9e3}.list-item:last-child{border-bottom:0}.list-item small{display:block;color:var(--muted);margin-top:3px}.amount{font-weight:700;white-space:nowrap}.delete{background:transparent;color:#a4778b;font-size:12px;padding:4px}.bottom-note{text-align:center;color:#a4778b;font-size:11px;padding:15px}.empty{padding:25px;text-align:center;color:var(--muted)}.bar{height:7px;background:#f5dce6;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--lime);border-radius:9px}.calendar-day.selected{border-color:var(--lime);color:var(--lime);background:#f8d6e4}.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.period{background:#fff0f5;border-radius:14px;padding:12px 9px}.period small{display:block;color:var(--muted);font-size:12px}.period strong{display:block;margin-top:5px;font-size:15px}.notice{background:#fff0f5;border-radius:12px;padding:12px;color:var(--muted);font-size:12px;line-height:1.5}
.bill-card{background:#ffffff;border:1px solid #edbfd1;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 14px #d78aa522}
.bill-name{font-size:18px;display:block}
.bill-meta{display:block;color:var(--muted);font-size:13px;margin-top:7px}
.bill-badge{display:inline-block;background:#d94f87;color:#ffffff;font-size:10px;font-weight:850;letter-spacing:.04em;border-radius:8px;padding:7px 9px;text-align:center;max-width:48%}
.bill-progress{height:10px;background:#f5dce6;border-radius:99px;overflow:hidden;margin:16px 0 10px}
.bill-progress i{display:block;height:100%;background:#d94f87;border-radius:99px}
.bill-count{font-size:14px;color:#a82f62}
.bill-card .primary{flex:1;padding:12px 10px}
.bill-card button:disabled{opacity:.55;cursor:default}
.bill-card .delete{padding:10px 12px;border-radius:10px}@media(min-width:600px){.hero{margin-top:18px;border-radius:24px}.app{padding:0 12px 88px}.tabs{border-radius:16px;top:0}}
</style>

<style id="report-custom-colors">
.report-incoming, .report-incoming strong { color: #198754 !important; }
.report-available-balance, .report-available-balance strong { color: #c94f8a !important; }
.report-category-line { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid #f3dce6; }
.report-category-line:last-child { border-bottom:0; }
.report-category-name { color:#694253; }
.report-category-value { color:#198754; font-weight:700; white-space:nowrap; }
</style>


<style id="requested-balance-colors">
.report-incoming, .report-incoming strong { color: #198754 !important; }
.report-available-balance, .report-available-balance strong { color: #c94f8a !important; }
</style>

</head>
<body>
<div class="app">
<header class="hero">
  <div class="brand"><div class="logo">▣</div><div><h1>Meu Dinheiro do Dia</h1><p>Seu dinheiro, sob controle.</p></div></div>
  <div class="eyebrow">PATRIMÔNIO TOTAL</div><div class="big" id="netWorth">R$ 0,00</div>
  <div class="metrics">
    <div class="metric"><span>↙ Entradas no mês</span><strong class="green" id="incomeTotal">R$ 0,00</strong></div>
    <div class="metric"><span>↗ Despesas no mês</span><strong class="red" id="expenseTotal">R$ 0,00</strong></div>
    <div class="metric"><span>◉ Saldo do mês</span><strong id="cashTotal">R$ 0,00</strong></div>
    <div class="metric"><span>▥ Total investido</span><strong class="green" id="investmentTotal">R$ 0,00</strong></div>
  </div>
</header>
<nav class="tabs">
  <button class="tab active" data-tab="inicio"><b>⌂</b>Início</button>
  <button class="tab" data-tab="calendario"><b>▦</b>Calendário</button><button class="tab" data-tab="relatorios"><b>▥</b>Relatórios</button>
  <button class="tab" data-tab="investimentos"><b>◈</b>Investir</button>
  <button class="tab" data-tab="historico"><b>◷</b>Histórico</button><button class="tab" data-tab="contas"><b>▤</b>Contas</button>
</nav>
<main class="content" id="content"></main>
<div class="bottom-note">Seus dados ficam salvos neste navegador neste aparelho.</div>
</div>
<script>
const KEY='meuDinheiroDoDia_v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const initial={cashStart:0,investStart:0,records:[],bills:[],cards:[],customCategories:{despesa:[],entrada:[],investimento:[]}};
let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')};state.customCategories={despesa:[],entrada:[],investimento:[],...(state.customCategories||{})};state.bills=state.bills||[];state.cards=state.cards||[]}catch{state={...initial,customCategories:{despesa:[],entrada:[],investimento:[]}}}
let tab='inicio',reportPeriod='mes';
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));renderHeader()};
const sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0);
function values(){
 const r=state.records;
 // O resumo mensal começa de novo automaticamente a cada mês.
 const current=r.filter(x=>x.date && x.date.slice(0,7)===today().slice(0,7));
 const income=sum(current.filter(x=>x.type==='entrada'),x=>x.amount);
 const expenses=sum(current.filter(x=>x.type==='despesa'),x=>x.amount);
 // O saldo disponível e os investimentos carregam os valores acumulados de todos os meses.
 const allIncome=sum(r.filter(x=>x.type==='entrada'),x=>x.amount);
 const allExpenses=sum(r.filter(x=>x.type==='despesa'),x=>x.amount);
 const transfers=sum(r.filter(x=>x.type==='aporte'),x=>x.amount)-sum(r.filter(x=>x.type==='resgate'),x=>x.amount);
 const investment=Number(state.investStart||0)+transfers+sum(r.filter(x=>x.type==='rendimento'),x=>x.amount)-sum(r.filter(x=>x.type==='perda'),x=>x.amount);
 const cash=Number(state.cashStart||0)+allIncome-allExpenses-transfers;
 // O painel mensal mostra apenas o movimento do mês atual; patrimônio guardado continua acumulado.
 const monthTransfers=sum(current.filter(x=>x.type==='aporte'),x=>x.amount)-sum(current.filter(x=>x.type==='resgate'),x=>x.amount);
 const monthCash=sum(current.filter(x=>x.type==='entrada'),x=>x.amount)-sum(current.filter(x=>x.type==='despesa'),x=>x.amount)-monthTransfers;
 return {income,expenses,investment,cash,monthCash,net:cash+investment};
}
function renderHeader(){const v=values();document.getElementById('netWorth').textContent=money(v.net);document.getElementById('incomeTotal').textContent=money(v.income);document.getElementById('expenseTotal').textContent=money(v.expenses);document.getElementById('cashTotal').textContent=money(v.monthCash);document.getElementById('investmentTotal').textContent=money(v.investment)}
function field(label,id,placeholder='',type='text',value=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${escapeHtml(value)}" ${type==='number'?'min="0" step="0.01"':''}></div>`}
function builtInCategories(type){return type==='entrada'?['Salário','Vendas','Renda extra','Reembolso','Outros']:['Alimentação','Transporte','Moradia','Saúde','Lazer','Contas','Educação','Compras','Outros']}
function categoryOptions(type){return [...new Set([...builtInCategories(type),...(state.customCategories[type]||[])])].map(x=>`<option>${escapeHtml(x)}</option>`).join('')}
function renderCategoryList(){return ['despesa','entrada','investimento'].map(type=>`<div style="margin:12px 0"><b>${type==='despesa'?'Categorias de despesas':type==='entrada'?'Categorias de entradas':'Locais / categorias de investimentos'}</b>${(state.customCategories[type]||[]).map(name=>`<div class="list-item"><span>${escapeHtml(name)}</span><button class="delete" data-cat-delete="${type}|${escapeHtml(name)}">Remover</button></div>`).join('')||'<p class="hint">Nenhuma categoria personalizada ainda.</p>'}</div>`).join('')}
function recordForm(){return `<section class="card"><h2 class="section-title">Adicionar movimentação</h2><div class="choice" id="moneyChoices"><button class="selected" data-type="despesa">Despesa</button><button data-type="entrada">Entrada</button></div>${field('Valor (R$)','moneyAmount','0,00','text')}${field('Descrição','moneyDesc','Ex.: supermercado') }<div class="field"><label for="moneyCategory">Categoria</label><select id="moneyCategory">${categoryOptions("despesa")}</select></div><div class="field"><label for="moneyDate">Data</label><input id="moneyDate" type="date" value="${today()}"></div><button class="primary" id="saveMoney">Salvar movimentação</button></section>`}
function rowRecord(r){const plus=['entrada','rendimento','aporte'].includes(r.type);const names={entrada:'Entrada',despesa:'Despesa',aporte:'Aporte',resgate:'Resgate',rendimento:'Rendimento',perda:'Perda'};return `<div class="list-item"><div><b>${escapeHtml(r.description||names[r.type])}</b><small>${names[r.type]} · ${escapeHtml(r.category||r.investment||'Geral')} · ${r.date}</small></div><div style="text-align:right"><div class="amount ${plus?'green':'red'}">${plus?'+':'−'}${money(r.amount)}</div><button class="delete" data-delete="${r.id}">Excluir</button></div></div>`}
function render(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const c=document.getElementById('content'),v=values(),r=[...state.records].sort((a,b)=>b.date.localeCompare(a.date));
 if(tab==='inicio'){
 c.innerHTML=`<h2 class="section-title">Resumo financeiro</h2>${recordForm()}<section class="card"><div class="row between"><h3 style="margin:0">Últimas movimentações</h3><button class="secondary" id="goHistory">Ver todas</button></div>${r.slice(0,4).map(rowRecord).join('')||'<div class="empty">Nenhuma movimentação ainda. Adicione sua primeira entrada ou despesa acima.</div>'}</section><section class="card"><h3>Configurar saldos iniciais</h3><p class="hint">Informe os valores que você já tem antes de começar. Isso não é uma entrada nova.</p>${field('Dinheiro disponível inicial (R$)','cashStart','0,00','number',state.cashStart)}${field('Investimentos existentes (R$)','investStart','0,00','number',state.investStart)}<button class="primary" id="saveOpening">Salvar saldos iniciais</button></section><section class="card"><h3>Minhas categorias</h3><p class="hint">Crie categorias personalizadas para organizar suas entradas e despesas.</p>${field('Nova categoria ou nome do local','newCategory','Ex.: Pets, academia, Reserva Nubank')}<div class="choice"><button class="selected" id="catForExpense" type="button">Despesa</button><button id="catForIncome" type="button">Entrada</button><button id="catForInvestment" type="button">Investimento / onde guardar</button></div><button class="primary" id="addCategory">Adicionar categoria</button><div id="categoryList" style="margin-top:12px">${renderCategoryList()}</div></section>`;
 bindMoneyForm();document.getElementById('goHistory').onclick=()=>{tab='historico';render()};document.getElementById('saveOpening').onclick=()=>{state.cashStart=Math.max(0,Number(document.getElementById('cashStart').value)||0);state.investStart=Math.max(0,Number(document.getElementById('investStart').value)||0);save();render()};
 let newCatType='despesa';
 document.getElementById('catForExpense').onclick=()=>{newCatType='despesa';document.getElementById('catForExpense').classList.add('selected');document.getElementById('catForIncome').classList.remove('selected')};
 document.getElementById('catForIncome').onclick=()=>{newCatType='entrada';['catForExpense','catForIncome','catForInvestment'].forEach(id=>document.getElementById(id).classList.toggle('selected',id==='catForIncome'))};
 document.getElementById('catForInvestment').onclick=()=>{newCatType='investimento';['catForExpense','catForIncome','catForInvestment'].forEach(id=>document.getElementById(id).classList.toggle('selected',id==='catForInvestment'))};
 document.getElementById('catForExpense').onclick=()=>{newCatType='despesa';['catForExpense','catForIncome','catForInvestment'].forEach(id=>document.getElementById(id).classList.toggle('selected',id==='catForExpense'))};
 document.getElementById('addCategory').onclick=()=>{const input=document.getElementById('newCategory'),name=input.value.trim();if(!name){alert('Digite o nome da categoria.');return}if(name.length>32){alert('Use até 32 caracteres para o nome.');return}const list=state.customCategories[newCatType]||[];if([...(newCatType==='investimento'?['CDB','Tesouro Direto','Poupança','Ações','Fundos','Criptomoedas','Outro']:builtInCategories(newCatType)),...list].some(x=>x.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'))){alert('Essa categoria já existe.');return}state.customCategories[newCatType].push(name);save();render()};
 document.querySelectorAll('[data-cat-delete]').forEach(b=>b.onclick=()=>{const [type,name]=b.dataset.catDelete.split('|');if(confirm(`Remover a categoria "${name}" das opções futuras? Os registros antigos serão mantidos.`)){state.customCategories[type]=state.customCategories[type].filter(x=>x!==name);save();render()}});

 } else if(tab==='investimentos'){
 c.innerHTML=`<h2 class="section-title">Dinheiro Investido</h2><section class="card"><div class="eyebrow" style="margin-top:0">TOTAL INVESTIDO</div><div class="big">${money(v.investment)}</div><p class="hint">Aportes e resgates movimentam o dinheiro entre saldo disponível e investimentos. Rendimentos e perdas ajustam o valor investido.</p><div class="field"><label>Movimentação</label><select id="invType"><option value="aporte">Aporte</option><option value="resgate">Resgate</option><option value="rendimento">Rendimento</option><option value="perda">Perda / desvalorização</option></select></div><div class="field"><label>Tipo de investimento</label><select id="invName">${[...new Set(['CDB','Tesouro Direto','Poupança','Ações','Fundos','Criptomoedas','Reserva de emergência','Outro',...(state.customCategories.investimento||[])])].map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</select></div>${field('Valor (R$)','invAmount','0,00')}${field('Observação (opcional)','invDesc','Ex.: aporte mensal')}<div class="field"><label>Data</label><input id="invDate" type="date" value="${today()}"></div><button class="primary" id="saveInv">Registrar movimentação</button></section><section class="card"><h3>Movimentações de investimentos</h3>${r.filter(x=>['aporte','resgate','rendimento','perda'].includes(x.type)).map(rowRecord).join('')||'<div class="empty">Nenhum investimento registrado.</div>'}</section>`;
 document.getElementById('saveInv').onclick=()=>{const type=document.getElementById('invType').value,amount=parseAmount(document.getElementById('invAmount').value),v=values();if(!(amount>0)){alert('Informe um valor maior que zero.');return}if(type==='aporte'&&amount>v.cash){alert('Saldo disponível insuficiente para esse aporte.');return}if(type==='resgate'&&amount>v.investment){alert('O resgate não pode ser maior que o total investido.');return}addRecord({type,amount,investment:document.getElementById('invName').value,description:document.getElementById('invDesc').value.trim(),category:'Investimento',date:document.getElementById('invDate').value});};
 } else if(tab==='calendario'){
 const monthValue=window.calendarMonth||today().slice(0,7);
 const [year,month]=monthValue.split('-').map(Number);
 const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate();
 const offset=(first.getDay()+6)%7;
 const monthRecords=r.filter(x=>x.date&&x.date.slice(0,7)===monthValue);
 const selected=window.selectedCalendarDate||today();
 const selectedRecords=r.filter(x=>x.date===selected);
 const daySpend=sum(selectedRecords.filter(x=>x.type==='despesa'),x=>x.amount);
 const monthSpend=sum(monthRecords.filter(x=>x.type==='despesa'),x=>x.amount);
 const monthIncome=sum(monthRecords.filter(x=>x.type==='entrada'),x=>x.amount);
 const cells=Array.from({length:offset},()=>'<div></div>').concat(Array.from({length:days},(_,i)=>{const day=i+1,date=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const has=monthRecords.some(x=>x.date===date);return `<button class="secondary calendar-day ${date===selected?'selected':''}" data-date="${date}" style="padding:10px 0;position:relative">${day}${has?'<span style="display:block;color:var(--lime);font-size:9px">●</span>':''}</button>`})).join('');
 c.innerHTML=`<h2 class="section-title">Calendário financeiro</h2><section class="card"><div class="row between"><button class="secondary" id="prevMonth">‹</button><h3 id="monthTitle" style="margin:0">${new Date(year,month-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3><button class="secondary" id="nextMonth">›</button></div><div class="periods" style="grid-template-columns:repeat(7,1fr);gap:4px;margin-top:15px">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<small style="text-align:center;color:var(--muted)">${d}</small>`).join('')}${cells}</div><p class="hint">Os pontos verdes indicam dias com movimentações. Toque em uma data para ver os registros.</p></section><div class="periods"><div class="period"><small>Entradas no mês</small><strong class="green">${money(monthIncome)}</strong></div><div class="period"><small>Despesas no mês</small><strong class="red">${money(monthSpend)}</strong></div><div class="period"><small>Gastos no dia</small><strong>${money(daySpend)}</strong></div></div><section class="card" style="margin-top:12px"><h3>Movimentações de ${selected.split('-').reverse().join('/')}</h3>${selectedRecords.map(rowRecord).join('')||'<div class="empty">Nenhuma movimentação nesta data.</div>'}</section>`;
 document.getElementById('prevMonth').onclick=()=>{const d=new Date(year,month-2,1);window.calendarMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()};
 document.getElementById('nextMonth').onclick=()=>{const d=new Date(year,month,1);window.calendarMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()};
 document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{window.selectedCalendarDate=b.dataset.date;render()});
 } else if(tab==='relatorios'){
 const filtered=r.filter(x=>x.type==='despesa'&&inPeriod(x.date,reportPeriod));
 const total=sum(filtered,x=>x.amount),cats={};filtered.forEach(x=>cats[x.category||'Outros']=(cats[x.category||'Outros']||0)+x.amount);
 const periods=[['dia','Hoje'],['semana','Semana'],['mes','Mês']];
 c.innerHTML=`<h2 class="section-title">Resumo financeiro</h2><p class="hint" style="margin-top:-8px;margin-bottom:14px">Veja de forma simples o que entrou, o que saiu e quanto você tem guardado.</p><div class="choice" id="periodChoices">${periods.map(([id,label])=>`<button data-period="${id}" class="${reportPeriod===id?'selected':''}">${label}</button>`).join('')}</div><section class="card"><div class="eyebrow" style="margin-top:0">RESUMO DO PERÍODO · ${reportPeriod==='dia'?'HOJE':reportPeriod==='semana'?'ESTA SEMANA':'ESTE MÊS'}</div><div class="metrics"><div class="metric"><span>↓ Dinheiro que entrou</span><strong class="green">${money(sum(r.filter(x=>x.type==='entrada'&&inPeriod(x.date,reportPeriod)),x=>x.amount))}</strong></div><div class="metric"><span>↑ Dinheiro gasto</span><strong class="red">${money(total)}</strong></div><div class="metric"><span>Saldo disponível</span><strong class="${sum(r.filter(x=>x.type==='entrada'&&inPeriod(x.date,reportPeriod)),x=>x.amount)-total>=0?'green':'red'}">${money(sum(r.filter(x=>x.type==='entrada'&&inPeriod(x.date,reportPeriod)),x=>x.amount)-total)}</strong></div><div class="metric"><span>Investido no período</span><strong>${money(sum(r.filter(x=>x.type==='aporte'&&inPeriod(x.date,reportPeriod)),x=>x.amount))}</strong></div></div><p class="hint">O saldo do período é entradas menos despesas. Aportes são mostrados separadamente porque representam dinheiro transferido para investimentos.</p></section><section class="card"><h3>Quanto você tem hoje</h3><div class="eyebrow" style="margin-top:8px">PATRIMÔNIO TOTAL</div><div class="big">${money(values().net)}</div><div class="list-item"><span>Dinheiro disponível</span><b>${money(values().cash)}</b></div><div class="list-item"><span>Dinheiro guardado / investido</span><b class="green">${money(values().investment)}</b></div><div style="margin-top:8px"><div class="eyebrow">ONDE ESTÁ SEU DINHEIRO</div>${Object.entries((()=>{const map={};r.filter(x=>x.type==='aporte').forEach(x=>{const key=x.category||x.name||'Sem categoria';map[key]=(map[key]||0)+Number(x.amount||0)});r.filter(x=>x.type==='resgate').forEach(x=>{const key=x.category||x.name||'Sem categoria';map[key]=(map[key]||0)-Number(x.amount||0)});return map})()).filter(([k,val])=>val>0).sort((a,b)=>b[1]-a[1]).map(([name,val])=>`<div class="report-category-line"><span class="report-category-name">${escapeHtml(name)}</span><span class="report-category-value">${money(val)}</span></div>`).join('')||'<p class="hint">Ainda não há valores guardados separados por categoria. Registre aportes com uma categoria para acompanhar onde está seu dinheiro.</p>'}</div><div class="list-item"><span>Entradas neste mês</span><b class="green">${money(values().income)}</b></div><div class="list-item"><span>Despesas neste mês</span><b class="red">${money(values().expenses)}</b></div><p class="hint">O histórico permanece salvo entre os meses. O resumo de entradas e despesas considera somente o período selecionado; o dinheiro guardado/investido continua acumulado. Registre seu saldo inicial em Início para melhorar o cálculo do patrimônio.</p></section><section class="card"><h3>Contas e parcelas a pagar</h3><div class="list-item"><span>Contas parceladas restantes</span><b>${money(sum(state.bills||[],b=>Math.max(0,Number(b.total||0)*(Number(b.count||1)-Number(b.paid||0))/Math.max(1,Number(b.count||1)))))}</b></div><div class="list-item"><span>Compras parceladas no cartão restantes</span><b>${money(sum(state.cards||[],card=>sum(card.purchases||[],x=>Math.max(0,Number(x.amount||0)-Number(x.paidAmount||0)))))}</b></div><p class="hint">Estimativa baseada nas contas e compras cadastradas por você.</p></section><section class="card"><h3>Gastos por categoria</h3>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([name,val])=>`<div style="margin:16px 0"><div class="row between"><span>${escapeHtml(name)}</span><b>${money(val)}</b></div><div class="bar"><i style="width:${total?Math.min(100,val/total*100):0}%"></i></div><small class="hint">${total?(val/total*100).toLocaleString('pt-BR',{maximumFractionDigits:1}):0}% das despesas do período</small></div>`).join('')||'<div class="empty">Sem despesas neste período.</div>'}</section><section class="card"><h3>Movimentações do período</h3>${r.filter(x=>inPeriod(x.date,reportPeriod)&&['entrada','despesa','aporte','resgate','rendimento','perda'].includes(x.type)).sort((a,b)=>b.date.localeCompare(a.date)).map(rowRecord).join('')||'<div class="empty">Nenhuma movimentação encontrada.</div>'}</section>`;
 document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{reportPeriod=b.dataset.period;render()});
 } else if(tab==='contas'){
 const bills=state.bills||[],cards=state.cards||[];
  const monthKey=today().slice(0,7);
  const billsDue=bills.filter(b=>(Number(b.paid)||0)<(Number(b.count)||0)&&(b.nextDate||b.date||'').slice(0,7)===monthKey);
  const dueInstallments=billsDue.length;
  const dueAmount=billsDue.reduce((n,b)=>n+Math.max(0,(Number(b.total)||0)*(1-(Number(b.paid)||0)/(Number(b.count)||1))),0);
  c.innerHTML=`<h2 class="section-title">Contas parceladas e cartões</h2><p class="hint" style="margin-top:-8px;margin-bottom:14px">Período atual: ${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}. Ao virar o mês, o resumo mensal recomeça; contas e parcelas futuras continuam cadastradas e o histórico não é apagado.</p><section class="card"><h3>Contas a pagar neste mês</h3><div class="metrics"><div class="metric"><span>Contas com vencimento neste mês</span><strong class="green">${billsDue.length}</strong></div><div class="metric"><span>Parcelas a pagar</span><strong class="green">${dueInstallments}</strong></div></div><div class="eyebrow">VALOR ESTIMADO PENDENTE</div><div class="big">${money(dueAmount)}</div><p class="hint">Considera o próximo vencimento cadastrado de cada conta.</p></section><section class="card"><h3>Adicionar conta parcelada</h3>${field('Nome da conta','billName','Ex.: celular, geladeira')}${field('Valor total (R$)','billTotal','0,00','text')}${field('Quantidade de parcelas','billCount','12','number',12)}<div class="field"><label for="billDate">Primeiro vencimento</label><input id="billDate" type="date" value="${today()}"></div><button class="primary" id="addBill">Cadastrar conta</button><p class="hint">As parcelas são calculadas automaticamente. Marque cada parcela como paga para acompanhar o que falta.</p></section><section class="card"><h3>Minhas contas parceladas</h3>${bills.map((b,i)=>{const paid=Number(b.paid)||0,count=Number(b.count)||1,remaining=Math.max(0,count-paid),per=Number(b.total||0)/count;return `<div class="bill-card"><div class="row between" style="align-items:flex-start"><div><b class="bill-name">${escapeHtml(b.name)}</b><small class="bill-meta">Total da conta: ${money(b.total)}</small></div><span class="bill-badge">${remaining===0?'QUITADA':remaining+' PENDENTE'+(remaining===1?'':'S')}</span></div><div class="bill-progress"><i style="width:${Math.min(100,paid/count*100)}%"></i></div><div class="row between"><strong class="bill-count">${paid} de ${count} parcelas pagas</strong><strong>${money(per)} <small>/ parcela</small></strong></div><small class="bill-meta">Próximo vencimento: ${escapeHtml(b.nextDate||b.date)}</small><div class="row" style="margin-top:12px"><button class="primary" data-bill-paid="${i}" ${paid>=count?'disabled':''}>${paid>=count?'Conta quitada':'✓ Marcar parcela paga'}</button><button class="delete" data-bill-delete="${i}">Excluir</button></div></div>`}).join('')||'<div class="empty">Nenhuma conta cadastrada.</div>'}</section><section class="card"><h3>Cadastrar cartão de crédito</h3>${field('Nome do cartão','cardName','Ex.: Nubank')}${field('Limite (R$)','cardLimit','0,00','text')}${field('Dia de vencimento da fatura (1–31)','cardDue','10','number',10)}<button class="primary" id="addCard">Adicionar cartão</button></section><section class="card"><h3>Meus cartões</h3>${cards.map((card,i)=>`<div class="list-item"><div><b>${escapeHtml(card.name)}</b><small>Limite: ${money(card.limit)} · Compras cadastradas: ${(card.purchases||[]).length} · Vencimento dia ${card.due}</small><small>Compras parceladas:</small>${(card.purchases||[]).map((x,j)=>{const paid=Number(x.paid)||0,count=Math.max(1,Number(x.count)||1),remaining=Math.max(0,count-paid),per=Number(x.amount||0)/count;return `<div class="bill-card"><div class="row between" style="align-items:flex-start"><div><b class="bill-name">${escapeHtml(x.name)}</b><small class="bill-meta">Total da compra: ${money(x.amount)}</small></div><span class="bill-badge">${remaining===0?'QUITADA':remaining+' PENDENTE'+(remaining===1?'':'S')}</span></div><div class="bill-progress"><i style="width:${Math.min(100,paid/count*100)}%"></i></div><div class="row between"><strong class="bill-count">${paid} de ${count} parcelas pagas</strong><strong>${money(per)} <small>/ parcela</small></strong></div><div class="row" style="margin-top:12px"><button class="primary" data-card-paid="${i}|${j}" ${paid>=count?'disabled':''}>${paid>=count?'Compra quitada':'✓ Marcar parcela paga'}</button></div></div>`}).join('')||'<small>Nenhuma compra cadastrada.</small>'}<div style="margin-top:12px"><input type="text" placeholder="Nome da compra" id="purchaseName${i}" style="width:100%;background:#fffafd;border:1px solid #e4b9cb;border-radius:13px;padding:13px;color:var(--text);margin:4px 0"><input type="text" placeholder="Valor total R$" id="purchaseAmount${i}" style="width:100%;background:#fffafd;border:1px solid #e4b9cb;border-radius:13px;padding:13px;color:var(--text);margin:4px 0"><input type="number" min="1" value="1" id="purchaseCount${i}" placeholder="Parcelas" style="width:100%;background:#fffafd;border:1px solid #e4b9cb;border-radius:13px;padding:13px;color:var(--text);margin:4px 0"><button class="secondary" data-card-purchase="${i}">Adicionar compra parcelada</button></div></div><button class="delete" data-card-delete="${i}">Excluir cartão</button></div>`).join('')||'<div class="empty">Nenhum cartão cadastrado.</div>'}<p class="hint">Este controle organiza limites e parcelas cadastradas, mas não se conecta automaticamente ao banco ou à operadora do cartão.</p></section>`;
 document.getElementById('addBill').onclick=()=>{const name=document.getElementById('billName').value.trim(),total=parseAmount(document.getElementById('billTotal').value),count=Math.floor(Number(document.getElementById('billCount').value)),date=document.getElementById('billDate').value;if(!name||total<=0||count<1||!date){alert('Preencha nome, valor, parcelas e vencimento.');return}state.bills.push({name,total,count,paid:0,date,nextDate:date});save();render()};
 document.querySelectorAll('[data-bill-paid]').forEach(b=>b.onclick=()=>{const x=state.bills[Number(b.dataset.billPaid)];if(x.paid>=x.count){alert('Todas as parcelas já foram pagas.');return}x.paid++;const d=new Date((x.nextDate||x.date)+'T12:00:00');d.setMonth(d.getMonth()+1);x.nextDate=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;save();render()});document.querySelectorAll('[data-bill-delete]').forEach(b=>b.onclick=()=>{if(confirm('Excluir esta conta parcelada?')){state.bills.splice(Number(b.dataset.billDelete),1);save();render()}});
 document.getElementById('addCard').onclick=()=>{const name=document.getElementById('cardName').value.trim(),limit=parseAmount(document.getElementById('cardLimit').value),due=Math.max(1,Math.min(31,Number(document.getElementById('cardDue').value)||1));if(!name||limit<=0){alert('Informe o nome do cartão e o limite.');return}state.cards.push({name,limit,due,purchases:[]});save();render()};document.querySelectorAll('[data-card-delete]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este cartão e suas compras cadastradas?')){state.cards.splice(Number(b.dataset.cardDelete),1);save();render()}});document.querySelectorAll('[data-card-purchase]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.cardPurchase),card=state.cards[i],name=document.getElementById('purchaseName'+i).value.trim(),amount=parseAmount(document.getElementById('purchaseAmount'+i).value),count=Math.floor(Number(document.getElementById('purchaseCount'+i).value));if(!name||amount<=0||count<1){alert('Informe o nome da compra, valor e quantidade de parcelas.');return}const used=card.purchases.reduce((a,x)=>a+x.amount-(x.paidAmount||0),0);if(used+amount>card.limit&&!confirm('Esta compra ultrapassa o limite informado. Deseja cadastrá-la mesmo assim?'))return;card.purchases.push({name,amount,count,paid:0,paidAmount:0});save();render()});document.querySelectorAll('[data-card-paid]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.cardPaid.split('|').map(Number),purchase=state.cards[i].purchases[j];if(purchase.paid>=purchase.count)return;purchase.paid=(purchase.paid||0)+1;purchase.paidAmount=Math.min(purchase.amount,(purchase.paidAmount||0)+purchase.amount/purchase.count);save();render()});
 } else {
 c.innerHTML=`<h2 class="section-title">Histórico completo</h2><section class="card"><div class="choice" id="histFilters"><button class="selected" data-filter="todos">Tudo</button><button data-filter="entrada">Entradas</button><button data-filter="despesa">Despesas</button><button data-filter="inv">Investimentos</button><button data-filter="resgate">Resgates</button></div><div class="choice" style="margin-top:12px"><button class="secondary" id="deleteExpenses">Excluir despesas</button><button class="secondary" id="deleteEntries">Excluir entradas</button><button class="secondary" id="deleteInvestments">Excluir investimentos</button><button class="secondary" id="deleteRedemptions">Excluir resgates</button><button class="delete" id="deleteEverything">Excluir tudo</button></div><p class="hint">Cada exclusão pede confirmação. Ela é permanente neste aparelho.</p><div id="historyList">${r.map(rowRecord).join('')||'<div class="empty">Seu histórico aparecerá aqui.</div>'}</div></section>`;
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));const f=b.dataset.filter;document.getElementById('historyList').innerHTML=r.filter(x=>f==='todos'||x.type===f||(f==='inv'&&['aporte','resgate','rendimento','perda'].includes(x.type))).map(rowRecord).join('')||'<div class="empty">Nenhum registro neste filtro.</div>';bindDeletes()});
 const removeTypes=(types,label)=>{
   const normalized=types.map(t=>String(t).toLocaleLowerCase('pt-BR'));
   const matching=state.records.filter(x=>normalized.includes(String(x.type||'').toLocaleLowerCase('pt-BR')));
   if(!matching.length){alert(`Não há ${label} para excluir.`);return}
   if(confirm(`Encontradas ${matching.length} movimentação(ões). Excluir ${label}? As contas parceladas, cartões e investimentos de saldo inicial serão mantidos. Esta ação não pode ser desfeita.`)){
     state.records=state.records.filter(x=>!normalized.includes(String(x.type||'').toLocaleLowerCase('pt-BR')));
     localStorage.setItem(KEY,JSON.stringify(state));
     render();
   }
 };
 document.getElementById('deleteExpenses').onclick=()=>removeTypes(['despesa'],'todas as despesas');
 document.getElementById('deleteEntries').onclick=()=>removeTypes(['entrada'],'todas as entradas');
 document.getElementById('deleteInvestments').onclick=()=>removeTypes(['aporte','rendimento','perda'],'todas as movimentações de investimento, exceto resgates');
 document.getElementById('deleteRedemptions').onclick=()=>removeTypes(['resgate'],'todos os resgates');
 document.getElementById('deleteEverything').onclick=()=>{
    if(confirm('ATENÇÃO: isso apagará TODOS os dados do Meu Dinheiro do Dia neste navegador: entradas, despesas, investimentos, contas parceladas, cartões, categorias personalizadas e saldos iniciais. Esta ação não pode ser desfeita. Deseja continuar?')){
      state={cashStart:0,investStart:0,records:[],bills:[],cards:[],customCategories:{despesa:[],entrada:[],investimento:[]}};
      localStorage.removeItem(KEY);
      localStorage.setItem(KEY,JSON.stringify(state));
      window.calendarMonth=today().slice(0,7);
      window.selectedCalendarDate=today();
      reportPeriod='mes';
      renderHeader();
      render();
      alert('Todos os dados do Meu Dinheiro do Dia foram apagados.');
    }
  };
 }
 bindDeletes();renderHeader();
}
function parseAmount(s){if(typeof s!=='string')s=String(s??'');s=s.trim().replace(/\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return Number.isFinite(n)?Math.round(n*100)/100:0}
function addRecord(data){state.records.push({...data,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)});save();render()}
function bindMoneyForm(){let type='despesa';const cat=document.getElementById('moneyCategory');document.querySelectorAll('#moneyChoices button').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('#moneyChoices button').forEach(x=>x.classList.toggle('selected',x===b));const old=cat.value;cat.innerHTML=categoryOptions(type);if([...cat.options].some(o=>o.value===old))cat.value=old});document.getElementById('saveMoney').onclick=()=>{const amount=parseAmount(document.getElementById('moneyAmount').value),description=document.getElementById('moneyDesc').value.trim(),date=document.getElementById('moneyDate').value;if(!(amount>0)||!description||!date){alert('Informe valor, descrição e data.');return}if(type==='despesa'&&amount>values().cash){if(!confirm('Essa despesa é maior que seu saldo disponível. Deseja registrar mesmo assim?'))return}addRecord({type,amount,description,category:document.getElementById('moneyCategory').value,date})}}
function bindDeletes(){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const record=state.records.find(x=>x.id===b.dataset.delete);if(!record)return;if(confirm(`Excluir '${record.description||record.type}'? Isso atualizará o histórico, os saldos e os relatórios. Contas e cartões não serão apagados.`)){state.records=state.records.filter(x=>x.id!==b.dataset.delete);localStorage.setItem(KEY,JSON.stringify(state));render()}})}
function inPeriod(date,period){const d=new Date(date+'T12:00:00'),now=new Date(),todayDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(period==='dia')return date===today();if(period==='mes')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();const monday=new Date(todayDate);monday.setDate(todayDate.getDate()-((todayDate.getDay()+6)%7));const sunday=new Date(monday);sunday.setDate(monday.getDate()+7);return d>=monday&&d<sunday}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();
</script>
